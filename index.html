<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازرگانی رز | صفحه معرفی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            position: relative;
            background: #e2e8f0;
        }

        /* طرح پس‌زمینه - موج‌های ملایم و مدرن */
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
        }

        .bg-pattern::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(74,144,226,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(100,116,139,0.06) 0%, transparent 50%),
                repeating-linear-gradient(45deg, rgba(100,116,139,0.02) 0px, rgba(100,116,139,0.02) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
        }

        /* امواج دایره‌ای تزیینی */
        .wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background: repeating-linear-gradient(90deg, 
                transparent, 
                transparent 50px, 
                rgba(74,144,226,0.03) 50px, 
                rgba(74,144,226,0.03) 100px);
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 520px;
            width: 100%;
        }

        /* کارت اصلی */
        .card {
            background: #ffffff;
            border-radius: 32px;
            padding: 48px 32px 40px;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.03);
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }
        .brand-name {
            font-size: 32px;
            font-weight: 700;
            color: #1a2c3e;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }
        .brand-tagline {
            font-size: 13px;
            color: #7c8b9c;
            letter-spacing: 1px;
            font-weight: 400;
        }

        .divider {
            width: 40px;
            height: 3px;
            background: linear-gradient(90deg, #4a90e2, #b8d9ff);
            margin: 0 auto 32px auto;
            border-radius: 3px;
        }

        /* دکمه‌ها - با رنگ خاکستری برای مشخص بودن */
        .links-section {
            margin-bottom: 32px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 12px 0;
            padding: 16px 22px;
            border-radius: 60px;
            text-decoration: none;
            transition: all 0.25s ease;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
        }

        .link-btn:hover {
            transform: translateY(-2px);
            background: #e9eef3;
            border-color: #cbd5e1;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.06);
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .link-icon {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 30px;
        }

        .link-icon img {
            width: 20px;
            height: 20px;
        }

        .link-text {
            font-weight: 550;
            font-size: 15px;
            color: #334155;
        }

        .link-arrow {
            color: #94a3b8;
            font-size: 18px;
            transition: transform 0.2s ease;
        }

        .link-btn:hover .link-arrow {
            transform: translateX(-4px);
            color: #4a90e2;
        }

        /* اینستاگرام - خاکستری با آیکون رنگی */
        .instagram-btn .link-icon {
            background: #f1f5f9;
        }
        .instagram-btn .link-icon img {
            filter: brightness(0.3);
        }

        /* واتساپ - خاکستری با آیکون رنگی */
        .whatsapp-btn .link-icon {
            background: #f1f5f9;
        }
        .whatsapp-btn .link-icon img {
            filter: brightness(0.3);
        }

        /* بخش شماره تماس */
        .contact-section {
            background: #f8fafc;
            border-radius: 24px;
            padding: 20px;
            margin-top: 8px;
            border: 1px solid #eef2f6;
        }

        .contact-title {
            font-size: 12px;
            color: #8e9eae;
            text-align: center;
            margin-bottom: 16px;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .contact-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #e8edf2;
        }
        .contact-row:last-child {
            border-bottom: none;
        }

        .contact-row img {
            width: 18px;
            height: 18px;
            opacity: 0.5;
        }

        .contact-label {
            font-size: 13px;
            color: #5a6e7c;
            font-weight: 500;
        }

        .contact-number {
            direction: ltr;
            font-size: 14px;
            color: #2c3e50;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .footer {
            text-align: center;
            margin-top: 28px;
            font-size: 11px;
            color: #a5b7c9;
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    <div class="wave"></div>
    
    <div class="container">
        <div class="card">
            <div class="brand">
                <div class="brand-name">بازرگانی رز</div>
                <div class="brand-tagline">ارائه بهترین خدمات با کیفیت</div>
            </div>
            <div class="divider"></div>

            <div class="links-section">
                <!-- اینستاگرام -->
                <a href="https://www.instagram.com/bazergani.rose" class="link-btn instagram-btn">
                    <div class="link-left">
                        <div class="link-icon">
                            <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="اینستاگرام">
                        </div>
                        <span class="link-text">اینستاگرام</span>
                    </div>
                    <div class="link-arrow">←</div>
                </a>

                <!-- واتساپ ۱ -->
                <a href="https://wa.me/989144445799" class="link-btn whatsapp-btn">
                    <div class="link-left">
                        <div class="link-icon">
                            <img src="https://cdn-icons-png.flaticon.com/512/124/124034.png" alt="واتساپ">
                        </div>
                        <span class="link-text">واتساپ ۱</span>
                    </div>
                    <div class="link-arrow">←</div>
                </a>

                <!-- واتساپ ۲ -->
                <a href="https://wa.me/989122622765" class="link-btn whatsapp-btn">
                    <div class="link-left">
                        <div class="link-icon">
                            <img src="https://cdn-icons-png.flaticon.com/512/124/124034.png" alt="واتساپ">
                        </div>
                        <span class="link-text">واتساپ ۲</span>
                    </div>
                    <div class="link-arrow">←</div>
                </a>
            </div>

            <div class="contact-section">
                <div class="contact-title">راه‌های ارتباطی</div>
                <div class="contact-row">
                    <img src="https://cdn-icons-png.flaticon.com/512/724/724664.png" alt="تماس">
                    <span class="contact-label">شماره تماس ۱ :</span>
                    <span class="contact-number">۰۹۱۴۴۴۴۵۷۹۹</span>
                </div>
                <div class="contact-row">
                    <img src="https://cdn-icons-png.flaticon.com/512/724/724664.png" alt="تماس">
                    <span class="contact-label">شماره تماس ۲ :</span>
                    <span class="contact-number">۰۹۱۲۲۶۲۲۷۶۵</span>
                </div>
            </div>

            <div class="footer">
                بازرگانی رز | همراه همیشگی شما
            </div>
        </div>
    </div>
</body>
</html>
