<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه معرفی | بازرگانی رُز</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #000;
        }
        .bio {
            color: #666;
            font-size: 16px;
            margin-bottom: 40px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 12px 0;
            padding: 14px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 500;
            font-size: 16px;
            transition: all 0.2s ease;
            border: 1px solid #e0e0e0;
            background: white;
            color: #333;
        }
        .btn:hover {
            background: #f5f5f5;
            transform: scale(1.02);
        }
        .btn img {
            width: 24px;
            height: 24px;
        }
        .phone-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 12px 0;
            padding: 14px 20px;
            border-radius: 50px;
            border: 1px solid #e0e0e0;
            background: white;
        }
        .phone-row img {
            width: 24px;
            height: 24px;
        }
        .phone-row .label {
            font-weight: 500;
            color: #333;
            margin-left: 5px;
        }
        .phone-row .number {
            color: #666;
            direction: ltr;
            display: inline-block;
        }
        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #aaa;
        }
        hr {
            margin: 10px 0;
            border: 0.5px solid #eee;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>رز بازرگانی</h1>
        <div class="bio">---</div>
        
        <!-- اینستاگرام -->
        <a href="https://www.instagram.com/bazergani.rose" class="btn">
            <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="اینستاگرام">
            اینستاگرام من
        </a>
        
        <!-- واتساپ اول -->
        <a href="https://wa.me/989144445799" class="btn">
            <img src="https://cdn-icons-png.flaticon.com/512/124/124034.png" alt="واتساپ">
            واتساپ ۱
        </a>
        
        <!-- واتساپ دوم -->
        <a href="https://wa.me/989122622765" class="btn">
            <img src="https://cdn-icons-png.flaticon.com/512/124/124034.png" alt="واتساپ">
            واتساپ ۲
        </a>
        
        <!-- شماره تماس اول -->
        <div class="phone-row">
            <img src="https://cdn-icons-png.flaticon.com/512/724/724664.png" alt="تماس">
            <span class="label">تماس:</span>
            <span class="number">09144445799</span>
        </div>
        
        <!-- شماره تماس دوم -->
        <div class="phone-row">
            <img src="https://cdn-icons-png.flaticon.com/512/724/724664.png" alt="تماس">
            <span class="label">تماس:</span>
            <span class="number">09122622765</span>
        </div>
        
        <div class="footer">
            برای هماهنگی با من تماس بگیرید
        </div>
    </div>
</body>
</html>
