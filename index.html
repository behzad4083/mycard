<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازرگانی رز | صفحه معرفی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #e0f0ff 0%, #b8d9ff 50%, #8fc5ff 100%);
            position: relative;
        }

        /* افکت دایره‌های تزیینی آرامش‌بخش */
        body::before {
            content: '';
            position: absolute;
            top: 10%;
            left: -10%;
            width: 300px;
            height: 300px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: 10%;
            right: -10%;
            width: 250px;
            height: 250px;
            background: rgba(255,255,255,0.25);
            border-radius: 50%;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        /* کارت اصلی سفید با سایه نرم */
        .card {
            background: #ffffff;
            border-radius: 48px;
            padding: 45px 30px 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 5px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* لوگوی ساده با حرف اول اسم */
        .logo {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #4a90e2, #7bb3e0);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 8px 20px rgba(74,144,226,0.3);
        }
        .logo span {
            font-size: 32px;
            font-weight: 700;
            color: white;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #2c3e50;
            letter-spacing: -0.3px;
        }

        .bio {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid #ecf0f1;
            display: inline-block;
        }

        /* دکمه‌ها */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 12px 0;
            padding: 14px 20px;
            border-radius: 60px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(0.98);
        }

        .btn img {
            width: 22px;
            height: 22px;
        }

        /* دکمه اینستاگرام - آبی ملایم */
        .btn-instagram {
            background: #e8f0fe;
            color: #3b82f6;
            border: 1px solid #d0e2fc;
        }
        .btn-instagram:hover {
            background: #dce9fb;
            box-shadow: 0 5px 15px rgba(59,130,246,0.15);
        }

        /* دکمه واتساپ - سبز ملایم */
        .btn-whatsapp {
            background: #e8f8f0;
            color: #2ecc71;
            border: 1px solid #d0f0e0;
        }
        .btn-whatsapp:hover {
            background: #daf4e8;
            box-shadow: 0 5px 15px rgba(46,204,113,0.12);
        }

        /* ردیف شماره تماس - خاکستری روشن */
        .phone-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 10px 0;
            padding: 12px 20px;
            border-radius: 60px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            transition: all 0.2s ease;
        }
        .phone-row:hover {
            background: #f1f3f5;
            transform: translateY(-1px);
        }
        .phone-row img {
            width: 20px;
            height: 20px;
            opacity: 0.7;
        }
        .phone-row .label {
            font-weight: 600;
            color: #2c3e50;
            font-size: 14px;
        }
        .phone-row .number {
            color: #5a6e7c;
            direction: ltr;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .footer {
            margin-top: 25px;
            font-size: 11px;
            color: #95a5a6;
            border-top: 1px solid #ecf0f1;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">
                <span>ر</span>
            </div>
            <h1>بازرگانی رز</h1>
            <div class="bio">ارائه بهترین خدمات با کیفیت</div>
            
            <!-- اینستاگرام -->
            <a href="https://www.instagram.com/bazergani.rose" class="btn btn-instagram">
                <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="اینستاگرام">
                اینستاگرام بازرگانی رز
            </a>
            
            <!-- واتساپ ۱ -->
            <a href="https://wa.me/989144445799" class="btn btn-whatsapp">
                <img src="https://cdn-icons-png.flaticon.com/512/124/124034.png" alt="واتساپ">
                واتساپ ۱
            </a>
            
            <!-- واتساپ ۲ -->
            <a href="https://wa.me/989122622765" class="btn btn-whatsapp">
                <img src="https://cdn-icons-png.flaticon.com/512/124/124034.png" alt="واتساپ">
                واتساپ ۲
            </a>
            
            <!-- شماره تماس اول -->
            <div class="phone-row">
                <img src="https://cdn-icons-png.flaticon.com/512/724/724664.png" alt="تماس">
                <span class="label">تماس:</span>
                <span class="number">09144445799</span>
            </div>
            
            <!-- شماره تماس دوم -->
            <div class="phone-row">
                <img src="https://cdn-icons-png.flaticon.com/512/724/724664.png" alt="تماس">
                <span class="label">تماس:</span>
                <span class="number">09122622765</span>
            </div>
            
            <div class="footer">
                بازرگانی رز | همراه همیشگی شما
            </div>
        </div>
    </div>
</body>
</html>
