<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازرگانی رز | صفحه معرفی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            background: linear-gradient(145deg, #eef5ff 0%, #dce8f5 100%);
            position: relative;
        }

        /* المان‌های تزیینی مینیمال */
        .bg-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background: rgba(59,130,246,0.15);
            border-radius: 50%;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 520px;
            width: 100%;
        }

        /* کارت اصلی - طراحی مینیمال و تمیز */
        .card {
            background: #ffffff;
            border-radius: 32px;
            padding: 48px 32px 40px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0, 0, 0, 0.02);
            transition: all 0.3s ease;
            border: 1px solid rgba(0, 0, 0, 0.03);
        }

        /* نام برند با استایل حرفه‌ای */
        .brand {
            text-align: center;
            margin-bottom: 32px;
        }
        .brand-name {
            font-size: 32px;
            font-weight: 700;
            color: #1a2c3e;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }
        .brand-tagline {
            font-size: 13px;
            color: #7c8b9c;
            letter-spacing: 1px;
            font-weight: 400;
        }

        .divider {
            width: 40px;
            height: 3px;
            background: linear-gradient(90deg, #4a90e2, #b8d9ff);
            margin: 0 auto 32px auto;
            border-radius: 3px;
        }

        /* دکمه‌های لینک - طراحی یکدست و مینیمال */
        .links-section {
            margin-bottom: 32px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 12px 0;
            padding: 14px 20px;
            border-radius: 60px;
            text-decoration: none;
            transition: all 0.25s ease;
            border: 1px solid #eef2f6;
            background: #ffffff;
        }

        .link-btn:hover {
            transform: translateY(-2px);
            border-color: #d0e2fc;
            box-shadow: 0 6px 14px rgba(74,144,226,0.1);
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .link-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .link-icon img {
            width: 22px;
            height: 22px;
        }

        .link-text {
            font-weight: 550;
            font-size: 15px;
            color: #2c3e50;
        }

        .link-arrow {
            color: #b0c4de;
            font-size: 18px;
            transition: transform 0.2s ease;
        }

        .link-btn:hover .link-arrow {
            transform: translateX(-4px);
            color: #4a90e2;
        }

        /* اینستاگرام - آبی ملایم */
        .instagram-btn .link-icon {
            background: #e8f0fe;
            border-radius: 30px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* واتساپ - سبز ملایم */
        .whatsapp-btn .link-icon {
            background: #e8f8f0;
            border-radius: 30px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* بخش شماره تماس */
        .contact-section {
            background: #f8fafc;
            border-radius: 24px;
            padding: 20px;
            margin-top: 8px;
        }

        .contact-title {
            font-size: 12px;
            color: #8e9eae;
            text-align: center;
            margin-bottom: 16px;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .contact-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #e8edf2;
        }
        .contact-row:last-child {
            border-bottom: none;
        }

        .contact-row img {
            width: 18px;
            height: 18px;
            opacity: 0.6;
        }

        .contact-label {
            font-size: 13px;
            color: #5a6e7c;
            font-weight: 500;
        }

        .contact-number {
            direction: ltr;
            font-size: 15px;
            color: #2c3e50;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .footer {
            text-align: center;
            margin-top: 28px;
            font-size: 11px;
            color: #a5b7c9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="brand">
                <div class="brand-name">بازرگانی رز</div>
                <div class="brand-tagline">ارائه بهترین خدمات با کیفیت</div>
            </div>
            <div class="divider"></div>

            <div class="links-section">
                <!-- اینستاگرام -->
                <a href="https://www.instagram.com/bazergani.rose" class="link-btn instagram-btn">
                    <div class="link-left">
                        <div class="link-icon">
                            <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="اینستاگرام">
                        </div>
                        <span class="link-text">اینستاگرام</span>
                    </div>
                    <div class="link-arrow">←</div>
                </a>

                <!-- واتساپ ۱ -->
                <a href="https://wa.me/989144445799" class="link-btn whatsapp-btn">
                    <div class="link-left">
                        <div class="link-icon">
                            <img src="https://cdn-icons-png.flaticon.com/512/124/124034.png" alt="واتساپ">
                        </div>
                        <span class="link-text">واتساپ ۱</span>
                    </div>
                    <div class="link-arrow">←</div>
                </a>

                <!-- واتساپ ۲ -->
                <a href="https://wa.me/989122622765" class="link-btn whatsapp-btn">
                    <div class="link-left">
                        <div class="link-icon">
                            <img src="https://cdn-icons-png.flaticon.com/512/124/124034.png" alt="واتساپ">
                        </div>
                        <span class="link-text">واتساپ ۲</span>
                    </div>
                    <div class="link-arrow">←</div>
                </a>
            </div>

            <div class="contact-section">
                <div class="contact-title">راه‌های ارتباطی</div>
                <div class="contact-row">
                    <img src="https://cdn-icons-png.flaticon.com/512/724/724664.png" alt="تماس">
                    <span class="contact-label">شماره تماس ۱ :</span>
                    <span class="contact-number">۰۹۱۴۴۴۴۵۷۹۹</span>
                </div>
                <div class="contact-row">
                    <img src="https://cdn-icons-png.flaticon.com/512/724/724664.png" alt="تماس">
                    <span class="contact-label">شماره تماس ۲ :</span>
                    <span class="contact-number">۰۹۱۲۲۶۲۲۷۶۵</span>
                </div>
            </div>

            <div class="footer">
                بازرگانی رز | همراه همیشگی شما
            </div>
        </div>
    </div>
</body>
</html>
